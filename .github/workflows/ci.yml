name: CI Pipeline

on:
  push:
    branches: [main, master, naveen, feat/*]
  pull_request:
    branches: [main, master, naveen]

jobs:
  test-and-build:
    name: Lint, Test & Build (Next.js + NestJS + Prisma)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
      JWT_SECRET: "ci-test-jwt-secret-key-32chars-minimum"
      NEXT_PUBLIC_API_URL: "https://bug-refinery-api.onrender.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.21.0

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client (Backend)
        run: pnpm prisma:generate

      - name: Run Backend Unit & E2E Tests (Jest)
        run: pnpm test:backend

      - name: Run Frontend Tests (Vitest)
        run: pnpm test:frontend

      - name: Build Backend (NestJS)
        run: pnpm build:backend

      - name: Build Frontend (Next.js)
        run: pnpm build:frontend
